<h2 mat-dialog-title class="title-card mb-2">Cambiar Credenciales IPTV</h2>
<mat-dialog-content>
  <form ngNativeValidate [formGroup]="formContrato" (submit)="enviarDatos()">
    <mat-card>
      <mat-card-content>
        <div class="row">
          <div class="col-12 col-md-12">
            <span>Cliente: </span>
            <p class="fs-4 lh-sm">{{ getData[0].customerName }}</p>
          </div>
        </div>

        <!-- Checkbox IPTV -->
        <div class="row mb-2">
          <div class="col-12">
            <mat-checkbox formControlName="iptv" color="primary">
              Cuenta con servicio IPTV
            </mat-checkbox>
          </div>
        </div>

        <!-- Campos usuario/clave: visibles solo cuando iptv está activo -->
        <div class="row" *ngIf="formContrato.get('iptv')?.value">
          <div class="col-12 col-md-6 mb-2">
            <mat-form-field class="w-100" appearance="fill">
              <mat-label>Usuario IPTV</mat-label>
              <input
                matInput
                placeholder="Usuario IPTV"
                formControlName="userIptv"
              />
              <mat-error *ngIf="formContrato.get('userIptv')?.hasError('required')">
                El usuario es requerido
              </mat-error>
            </mat-form-field>
          </div>
          <div class="col-12 col-md-6">
            <mat-form-field class="w-100" appearance="fill">
              <mat-label>Contraseña IPTV</mat-label>
              <input
                matInput
                placeholder="Contraseña IPTV"
                formControlName="passIptv"
              />
              <mat-error *ngIf="formContrato.get('passIptv')?.hasError('required')">
                La contraseña es requerida
              </mat-error>
            </mat-form-field>
          </div>
        </div>

        <!-- Mensaje informativo cuando se desmarca -->
        <div class="row" *ngIf="!formContrato.get('iptv')?.value">
          <div class="col-12">
            <p class="text-muted fst-italic">
              Al guardar, el usuario y contraseña IPTV serán eliminados del contrato.
            </p>
          </div>
        </div>

      </mat-card-content>
      <mat-card-actions class="mt-3">
        <div class="d-flex flex-row justify-content-end w-100">
          <button
            [disabled]="formContrato.invalid"
            color="primary"
            mat-flat-button
            style="margin-right: 5px"
          >
            Guardar
          </button>
          <button mat-dialog-close="" color="accent" mat-raised-button>
            Cancelar
          </button>
        </div>
      </mat-card-actions>
    </mat-card>
  </form>
</mat-dialog-content>
