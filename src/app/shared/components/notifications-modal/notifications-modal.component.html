<div class="notifications-dialog">
  <header class="dialog-header">
    <div class="header-left">
      <h2 class="dialog-title">Notificaciones</h2>
      <span class="unread-badge" *ngIf="unreadCount > 0">
        {{ unreadCount }} nuevas
      </span>
    </div>
    
    <div class="header-actions">
      <button 
        *ngIf="unreadCount > 0" 
        class="action-btn mark-all-btn" 
        (click)="markAllAsRead()"
        title="Marcar todas como leídas">
        <mat-icon>done_all</mat-icon>
        <span>Marcar todo leídos</span>
      </button>
      <button class="close-btn" mat-dialog-close>
        <mat-icon>close</mat-icon>
      </button>
    </div>
  </header>

  <mat-dialog-content class="dialog-scroll-content">
    <!-- Loading State -->
    <div *ngIf="isLoading" class="state-container loading-state">
      <div class="spinner-ring">
        <div></div><div></div><div></div><div></div>
      </div>
      <p>Cargando tus notificaciones...</p>
    </div>

    <!-- Empty State -->
    <div *ngIf="!isLoading && (!notifications?.data || notifications?.data?.length === 0)" class="state-container empty-state">
      <div class="empty-icon-wrapper">
        <mat-icon>notifications_none</mat-icon>
      </div>
      <h3>Todo al día</h3>
      <p>No tienes notificaciones pendientes en este momento.</p>
    </div>

    <!-- Notifications List -->
    <div class="notifications-list" *ngIf="!isLoading && notifications?.data?.length">
      <div 
        *ngFor="let item of notifications?.data"
        (click)="markAsRead(item)"
        class="notification-card"
        [class.unread]="!item.read_at">
        
        <div class="notification-indicator" *ngIf="!item.read_at"></div>
        
        <div class="notification-main">
          <div class="card-header">
            <span class="card-subject">{{ item.data.subject }}</span>
            <span class="pulse-dot" *ngIf="!item.read_at"></span>
          </div>
          
          <p class="card-message">{{ item.data.message }}</p>
          
          <div class="card-footer">
            <span class="card-time">
              <mat-icon>schedule</mat-icon>
              {{ item.created_at | date:'dd/MM/yyyy hh:mm a' }}
            </span>
          </div>
        </div>
      </div>
    </div>
  </mat-dialog-content>

  <footer class="dialog-footer-actions" *ngIf="notifications?.total">
    <mat-paginator
      [length]="notifications?.total"
      [pageSize]="notifications?.per_page"
      [pageIndex]="(notifications?.current_page || 1) - 1"
      (page)="onPageChange($event)"
      class="minimal-paginator">
    </mat-paginator>
  </footer>
</div>
